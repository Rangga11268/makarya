<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Primary Sapphire to Indigo Gradient (Left Wing / Mahasiswa) -->
    <linearGradient id="makaryaGradLeft" x1="64" y1="80" x2="320" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Deep Royal Indigo Gradient (Right Wing / UMKM) -->
    <linearGradient id="makaryaGradRight" x1="448" y1="80" x2="192" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Emerald Glow Convergence (Escrow & Trust Apex) -->
    <linearGradient id="makaryaGradApex" x1="200" y1="180" x2="312" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Shadow for Tactile Elevation -->
    <filter id="makaryaDropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
  </defs>

  <g filter="url(#makaryaDropShadow)">
    <!-- Left Wing (Pillar of Youth & Talent) -->
    <path d="M 96 416 L 96 156 C 96 112, 148 90, 180 120 L 256 196 L 208 244 L 168 204 L 168 416 Z" 
          fill="url(#makaryaGradLeft)" />

    <!-- Right Wing (Pillar of Enterprise & UMKM) -->
    <path d="M 416 416 L 416 156 C 416 112, 364 90, 332 120 L 256 196 L 304 244 L 344 204 L 344 416 Z" 
          fill="url(#makaryaGradRight)" />

    <!-- Central Synergistic Arch / Interlocking Nexus -->
    <path d="M 256 196 L 332 272 C 348 288, 348 316, 332 332 L 284 380 C 268 396, 244 396, 228 380 L 180 332 C 164 316, 164 288, 180 272 Z" 
          fill="url(#makaryaGradApex)" />

    <!-- Inner Core Geometry Lens -->
    <path d="M 256 252 L 288 284 C 294 290, 294 300, 288 306 L 256 338 L 224 306 C 218 300, 218 290, 224 284 Z" 
          fill="#FFFFFF" 
          fill-opacity="0.95" />
  </g>
</svg>