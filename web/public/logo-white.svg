<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <!-- Facet 1: Left Outer Vertical Column (Vibrant Cyan-Sapphire) -->
    <linearGradient id="lockupWhiteLeftPillar" x1="80" y1="420" x2="160" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Facet 2: Right Inner Diagonal Rib -->
    <linearGradient id="lockupWhiteRightDiag" x1="250" y1="280" x2="360" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Facet 3: Right Outer Vertical Column -->
    <linearGradient id="lockupWhiteRightPillar" x1="350" y1="90" x2="440" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Specular Highlight Line -->
    <linearGradient id="lockupWhiteSpecular" x1="80" y1="90" x2="430" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Scaled 3D Ribbon Icon (88px tall, centered) -->
  <g transform="translate(6, 6) scale(0.172)">
    <!-- 1. Left Vertical Pillar -->
    <path d="M 76 420 L 76 136 C 76 104, 102 84, 134 84 L 164 84 L 256 268 L 194 268 L 148 176 L 148 420 Z" 
          fill="url(#lockupWhiteLeftPillar)" />

    <!-- 2. Right Vertical Pillar -->
    <path d="M 436 420 L 436 136 C 436 104, 410 84, 378 84 L 348 84 L 256 268 L 318 268 L 364 176 L 364 420 Z" 
          fill="url(#lockupWhiteRightPillar)" />

    <!-- 3. Center V Chevron (Interlocking Fold) -->
    <path d="M 164 84 L 256 268 L 348 84 L 386 84 L 276 304 C 264 328, 248 328, 236 304 L 126 84 Z" 
          fill="url(#lockupWhiteRightDiag)" />

    <!-- 4. Top Specular Chrome Edge -->
    <path d="M 84 136 C 84 110, 106 90, 134 90 L 160 90 L 256 276 L 352 90 L 378 90 C 406 90, 428 110, 428 136" 
          stroke="url(#lockupWhiteSpecular)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Wordmark: Makarya (White Bold Modern Typography) -->
  <text x="104" y="68" 
        font-family="System-UI, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="64" 
        font-weight="800" 
        letter-spacing="-1.5" 
        fill="#FFFFFF">Makarya</text>

  <!-- Brand Accent Dot -->
  <circle cx="384" cy="62" r="6" fill="#38BDF8" />
</svg>
