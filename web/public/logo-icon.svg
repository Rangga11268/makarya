<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="indigoGrad" x1="60" y1="100" x2="450" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="120" y1="200" x2="390" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C0FF" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer M Arch (Royal Indigo) -->
  <path d="M 88 380 L 88 160 C 88 118, 140 100, 172 135 L 256 226 L 340 135 C 372 100, 424 118, 424 160 L 424 380" 
        stroke="url(#indigoGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleShadow)" />

  <!-- Inner Infinity Collaboration Loop (Electric Cyan) -->
  <!-- Left Lobe -->
  <path d="M 256 280 C 200 210, 120 210, 120 280 C 120 350, 200 350, 256 280 C 312 210, 392 210, 392 280 C 392 350, 312 350, 256 280 Z" 
        stroke="url(#cyanGrad)" 
        stroke-width="42" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bottom Arch Support -->
  <path d="M 180 300 C 205 350, 307 350, 332 300" 
        stroke="url(#indigoGrad)" 
        stroke-width="48" 
        stroke-linecap="round" />
</svg>